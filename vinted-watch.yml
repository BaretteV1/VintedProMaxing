name: Vinted watch

on:
  schedule:
    # toutes les 10 minutes. GitHub peut retarder un peu en cas de forte charge,
    # c'est normal, ça reste largement suffisant pour de la veille.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour committer seen_ids.json

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot (un seul passage)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "vinted-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "update seen_ids"
          git push
